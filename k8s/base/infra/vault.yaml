apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: bookplus
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
  - port: 8200
    targetPort: 8200
    name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: bookplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/part-of: bookplus
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.17
        args:
        - server
        - -dev
        ports:
        - containerPort: 8200
          name: http
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          valueFrom:
            secretKeyRef:
              name: vault-secret
              key: token
        - name: VAULT_DEV_LISTEN_ADDRESS
          value: 0.0.0.0:8200
        - name: VAULT_ADDR
          value: http://0.0.0.0:8200
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

---
apiVersion: v1
kind: Secret
metadata:
  name: vault-secret
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: bookplus
type: Opaque
stringData:
  token: bookplus-root
