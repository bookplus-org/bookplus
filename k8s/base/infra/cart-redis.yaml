apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-redis
  labels:
    app.kubernetes.io/name: cart-redis
    app.kubernetes.io/part-of: bookplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-redis
        app.kubernetes.io/part-of: bookplus
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        args:
        - redis-server
        - --save
        - ''
        - --loglevel
        - warning
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: cart-redis
  labels:
    app.kubernetes.io/name: cart-redis
    app.kubernetes.io/part-of: bookplus
spec:
  selector:
    app.kubernetes.io/name: cart-redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
