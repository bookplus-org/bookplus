apiVersion: v1
kind: Secret
metadata:
  name: notification-postgres-secret
  labels:
    app.kubernetes.io/name: notification-postgres
    app.kubernetes.io/part-of: bookplus
type: Opaque
stringData:
  POSTGRES_PASSWORD: notification_pass

---
apiVersion: v1
kind: Service
metadata:
  name: notification-postgres
  labels:
    app.kubernetes.io/name: notification-postgres
    app.kubernetes.io/part-of: bookplus
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: notification-postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: pg

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notification-postgres
  labels:
    app.kubernetes.io/name: notification-postgres
    app.kubernetes.io/part-of: bookplus
spec:
  serviceName: notification-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-postgres
        app.kubernetes.io/part-of: bookplus
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: pg
        env:
        - name: POSTGRES_DB
          value: notification_db
        - name: POSTGRES_USER
          value: notification_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-postgres-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - notification_user
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
