apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: bookplus
data:
  config.yaml: "# OpenTelemetry Collector \u2014 punto central de telemetr\xEDa (est\xE1\
    ndar neutral).\n# Recibe trazas/m\xE9tricas por OTLP de los servicios y las reexporta:\n\
    #   trazas \u2192 Grafana Tempo (OTLP)   |   m\xE9tricas \u2192 endpoint Prometheus\n\
    receivers:\n  otlp:\n    protocols:\n      grpc:\n        endpoint: 0.0.0.0:4317\n\
    \      http:\n        endpoint: 0.0.0.0:4318\n\nprocessors:\n  batch: {}\n\nexporters:\n\
    \  otlp/tempo:\n    endpoint: tempo:4317\n    tls:\n      insecure: true\n  prometheus:\n\
    \    endpoint: 0.0.0.0:8889\n  debug:\n    verbosity: basic\n\nservice:\n  pipelines:\n\
    \    traces:\n      receivers: [otlp]\n      processors: [batch]\n      exporters:\
    \ [otlp/tempo, debug]\n    metrics:\n      receivers: [otlp]\n      processors:\
    \ [batch]\n      exporters: [prometheus, debug]\n"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: bookplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: bookplus
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.108.0
        ports:
        - containerPort: 4318
          name: http
        - containerPort: 4317
          name: grpc
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        args:
        - --config=/etc/otelcol/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
      volumes:
      - name: config
        configMap:
          name: otel-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: bookplus
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
  - port: 4318
    targetPort: 4318
    name: http
  - port: 4317
    targetPort: 4317
    name: grpc
