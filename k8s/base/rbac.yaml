apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookplus-app
  labels:
    app.kubernetes.io/part-of: bookplus
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookplus-app-read
  labels:
    app.kubernetes.io/part-of: bookplus
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - endpoints
  - services
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookplus-app-read
  labels:
    app.kubernetes.io/part-of: bookplus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bookplus-app-read
subjects:
- kind: ServiceAccount
  name: bookplus-app
  namespace: bookplus
