apiVersion: v1
kind: ConfigMap
metadata:
  name: report-service-config
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/part-of: bookplus
data:
  REPORT_DB_URL: jdbc:postgresql://report-postgres:5432/report_db
  REPORT_DB_USER: report_user
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_JPA_HIBERNATE_DDL_AUTO: none
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'

---
apiVersion: v1
kind: Secret
metadata:
  name: report-service-secret
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/part-of: bookplus
type: Opaque
stringData:
  REPORT_DB_PASS: report_pass
  REPORT_JWT_PUBLIC_KEY_BASE64: REPLACE_WITH_BASE64_VALUE

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/part-of: bookplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: report-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-service
        app.kubernetes.io/part-of: bookplus
    spec:
      containers:
      - name: report-service
        image: ghcr.io/bookplus-org/report-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8088
          name: http
        envFrom:
        - configMapRef:
            name: report-service-config
        - secretRef:
            name: report-service-secret
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          periodSeconds: 15
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          periodSeconds: 10
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/part-of: bookplus
spec:
  selector:
    app.kubernetes.io/name: report-service
  ports:
  - port: 8088
    targetPort: 8088
    name: http
