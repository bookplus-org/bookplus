apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/part-of: bookplus
data:
  CATALOG_DB_URL: jdbc:postgresql://catalog-postgres:5432/catalog_db
  CATALOG_DB_USER: catalog_user
  CATALOG_REDIS_HOST: catalog-redis
  CATALOG_REDIS_PORT: '6379'
  REDIS_HOST: catalog-redis
  REDIS_PORT: '6379'
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: '9200'
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_JPA_HIBERNATE_DDL_AUTO: none
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'

---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-service-secret
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/part-of: bookplus
type: Opaque
stringData:
  CATALOG_DB_PASS: catalog_pass
  CATALOG_JWT_PUBLIC_KEY_BASE64: REPLACE_WITH_BASE64_VALUE

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/part-of: bookplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/part-of: bookplus
    spec:
      serviceAccountName: bookplus-app
      containers:
      - name: catalog-service
        image: ghcr.io/bookplus-org/catalog-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        envFrom:
        - configMapRef:
            name: catalog-service-config
        - secretRef:
            name: catalog-service-secret
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          periodSeconds: 15
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          periodSeconds: 10
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/part-of: bookplus
    bookplus.io/metrics: 'true'
spec:
  selector:
    app.kubernetes.io/name: catalog-service
  ports:
  - port: 8082
    targetPort: 8082
    name: http
