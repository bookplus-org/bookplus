apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: bookplus
data:
  INVENTORY_DB_URL: jdbc:postgresql://inventory-postgres:5432/inventory_db?stringtype=unspecified
  INVENTORY_DB_USER: inventory_user
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'

---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-secret
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: bookplus
type: Opaque
stringData:
  INVENTORY_DB_PASS: inventory_pass
  INVENTORY_JWT_PUBLIC_KEY_BASE64: REPLACE_WITH_BASE64_VALUE

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: bookplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/part-of: bookplus
    spec:
      serviceAccountName: bookplus-app
      containers:
      - name: inventory-service
        image: ghcr.io/bookplus-org/inventory-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        - containerPort: 9090
          name: grpc
        envFrom:
        - configMapRef:
            name: inventory-service-config
        - secretRef:
            name: inventory-service-secret
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          periodSeconds: 15
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          periodSeconds: 10
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: bookplus
    bookplus.io/metrics: 'true'
spec:
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
  - port: 8083
    targetPort: 8083
    name: http
  - port: 9090
    targetPort: 9090
    name: grpc
