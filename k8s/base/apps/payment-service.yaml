apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: bookplus
data:
  PAYMENT_DB_URL: jdbc:postgresql://payment-postgres:5432/payment_db?stringtype=unspecified
  PAYMENT_DB_USER: payment_user
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_JPA_HIBERNATE_DDL_AUTO: none
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'

---
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: bookplus
type: Opaque
stringData:
  PAYMENT_DB_PASS: payment_pass
  PAYMENT_JWT_PUBLIC_KEY_BASE64: REPLACE_WITH_BASE64_VALUE

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: bookplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: bookplus
    spec:
      containers:
      - name: payment-service
        image: ghcr.io/bookplus-org/payment-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8086
          name: http
        envFrom:
        - configMapRef:
            name: payment-service-config
        - secretRef:
            name: payment-service-secret
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          periodSeconds: 15
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          periodSeconds: 10
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: bookplus
spec:
  selector:
    app.kubernetes.io/name: payment-service
  ports:
  - port: 8086
    targetPort: 8086
    name: http
