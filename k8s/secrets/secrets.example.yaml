# secrets.example.yaml — RELLENA los valores reales y NO lo commitees con datos reales.
# Flujo recomendado: rellenar -> kubeseal -> sealed-secrets.yaml (ese SI se commitea).
apiVersion: v1
kind: Secret
metadata:
  name: admin-bff-secret
  namespace: bookplus
type: Opaque
stringData:
  ADMIN_BFF_JWT_PUBLIC_KEY_BASE64: REPLACE_WITH_BASE64_VALUE

