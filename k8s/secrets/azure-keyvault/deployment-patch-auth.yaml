# Parche del Deployment auth-service para montar el volumen CSI que activa el SecretProviderClass.
# (Con secretObjects, el Secret 'auth-service-secret' se crea/actualiza solo y el envFrom sigue igual.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bookplus
spec:
  template:
    spec:
      containers:
        - name: auth-service
          volumeMounts:
            - name: kv
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: kv
          csi:
            driver: secrets-store.csi.x-k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: auth-service-kv
