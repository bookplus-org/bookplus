# Alternativa a Sealed Secrets: montar los secretos desde Azure Key Vault con el CSI driver.
# Requiere el add-on de AKS: az aks enable-addons --addons azure-keyvault-secrets-provider
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: auth-service-kv
  namespace: bookplus
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"          # identidad administrada del nodo/pod
    userAssignedIdentityID: "<CLIENT_ID_DE_LA_IDENTIDAD>"
    keyvaultName: "kv-bookplus"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: auth-db-pass
          objectType: secret
        - |
          objectName: jwt-private-key
          objectType: secret
        - |
          objectName: jwt-public-key
          objectType: secret
  # Además de montarlos como archivos, los sincroniza a un Secret de Kubernetes
  # para poder usarlos con envFrom/secretRef (igual que hoy):
  secretObjects:
    - secretName: auth-service-secret
      type: Opaque
      data:
        - { objectName: auth-db-pass,    key: DB_PASS }
        - { objectName: jwt-private-key, key: APP_SECURITY_JWT_PRIVATE_KEY }
        - { objectName: jwt-public-key,  key: APP_SECURITY_JWT_PUBLIC_KEY }
