{{- $g := . }}
{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    {{- include "bookplus.labels" $g | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ $g.Values.image.registry }}/{{ .name }}:{{ $g.Values.image.tag }}"
          imagePullPolicy: {{ $g.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
              name: http
          {{- if .env }}
          envFrom:
            - configMapRef:
                name: {{ .name }}-config
          {{- end }}
          {{- $path := ternary "/actuator/health" "/" .spring }}
          readinessProbe:
            httpGet: { path: {{ $path }}, port: {{ .port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $path }}, port: {{ .port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml $g.Values.resources | nindent 12 }}
---
{{- end }}
